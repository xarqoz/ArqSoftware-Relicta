# ═══════════════════════════════════════════════════════════════════════════════
# docker-compose.yml — Arquitectura Híbrida y Resiliente (Entrega 2)
#
# Topología:
#   ┌─────────┐     ┌──────────────────────────────────────────────┐
#   │ Cliente │────▶│              Nginx :80 (API Gateway)          │
#   └─────────┘     └──────────┬───────────────────────────────────┘
#                              │
#             ┌────────────────┴────────────────┐
#             ▼                                 ▼
#    / y /api/v1/ ── Django :8000     /api/v2/pagos/ ── Flask :5000
#             │
#             ▼ (tareas async)
#   Celery worker ──▶ Redis (Message Broker)
#
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ── 1. Monolito Django ──────────────────────────────────────────────────────
  django_web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: relicta_django
    environment:
      - ENV_TYPE=PROD
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-super-secret-dev-key-change-in-prod}
      - DEBUG=${DEBUG:-1}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,django_web,0.0.0.0,nginx}
      - DJANGO_CSRF_TRUSTED_ORIGINS=${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost,http://127.0.0.1}
      - DJANGO_DB_PATH=/app/data/db.sqlite3
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - ALIADO_API_URL=${ALIADO_API_URL:-https://dummyjson.com/products?limit=5}
    volumes:
      - django_data:/app/data
      - django_static:/app/staticfiles
    networks:
      - relicta_net
    expose:
      - "8000"
    depends_on:
      - redis
    restart: unless-stopped

  # ── 2. Microservicio de Pagos (Flask) ───────────────────────────────────────
  flask_pagos:
    build:
      context: ./microservicio_pagos
      dockerfile: Dockerfile
    container_name: relicta_flask_pagos
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:////app/data/pagos.db
      - PORT=5000
    volumes:
      - pagos_data:/app/data
    networks:
      - relicta_net
    expose:
      - "5000"
    restart: unless-stopped

  # ── 3. Redis — Message Broker ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: relicta_redis
    networks:
      - relicta_net
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── 4. Celery Worker — procesamiento asíncrono ───────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: relicta_celery
    command: celery -A relicta worker --loglevel=info
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-super-secret-dev-key-change-in-prod}
      - DEBUG=0
      - DJANGO_DB_PATH=/app/data/db.sqlite3
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - django_data:/app/data
    networks:
      - relicta_net
    depends_on:
      - redis
      - django_web
    restart: unless-stopped

  # ── 5. Nginx — API Gateway ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: relicta_nginx
    ports:
      # Host 8080 → contenedor 80. Cambia el 8080 si ese puerto también está
      # ocupado (p. ej. "9090:80"). El puerto interno del contenedor sigue siendo 80.
      - "${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Sirve los archivos estáticos recolectados por Django.
      - django_static:/app/staticfiles:ro
    depends_on:
      - django_web
      - flask_pagos
    networks:
      - relicta_net
    restart: unless-stopped

# ── Volúmenes ──────────────────────────────────────────────────────────────────
volumes:
  django_data:
    driver: local
  pagos_data:
    driver: local
  django_static:
    driver: local

# ── Red interna ────────────────────────────────────────────────────────────────
networks:
  relicta_net:
    driver: bridge
