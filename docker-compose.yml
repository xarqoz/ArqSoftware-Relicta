# ═══════════════════════════════════════════════════════════════════════════════
# docker-compose.yml — Arquitectura Strangler Pattern
#
# Topología:
#   ┌─────────┐     ┌──────────────────────────────────────────────┐
#   │ Cliente │────▶│                   Nginx :80                   │
#   └─────────┘     └──────────┬───────────────────────────────────┘
#                              │
#             ┌────────────────┴────────────────┐
#             ▼                                 ▼
#    /api/v1/ ── Django :8000        /api/v2/pagos/ ── Flask :5000
#
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ── 1. Monolito Django ──────────────────────────────────────────────────────
  django_web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: relicta_django
    environment:
      - ENV_TYPE=PROD
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-super-secret-dev-key-change-in-prod}
      - DEBUG=${DEBUG:-0}
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,django_web,0.0.0.0,nginx
    volumes:
      - django_data:/app/data
    networks:
      - relicta_net
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── 2. Microservicio de Pagos (Flask) ───────────────────────────────────────
  flask_pagos:
    build:
      context: ./microservicio_pagos
      dockerfile: Dockerfile
    container_name: relicta_flask_pagos
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:////app/data/pagos.db
      - PORT=5000
    volumes:
      - pagos_data:/app/data
    networks:
      - relicta_net
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── 3. Nginx — Proxy Inverso y Enrutador de Tráfico ────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: relicta_nginx
    ports:
      # Host 8080 → contenedor 80. Cambia el 8080 si ese puerto también está
      # ocupado (p. ej. "9090:80"). El puerto interno del contenedor sigue siendo 80.
      - "${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - django_web
      - flask_pagos
    networks:
      - relicta_net
    restart: unless-stopped

# ── Volúmenes ──────────────────────────────────────────────────────────────────
volumes:
  django_data:
    driver: local
  pagos_data:
    driver: local

# ── Red interna ────────────────────────────────────────────────────────────────
networks:
  relicta_net:
    driver: bridge
