# ═══════════════════════════════════════════════════════════════════════════════
# nginx.conf — Orquestación de Tráfico (Strangler Pattern)
#
# Estrategia de enrutamiento:
#   /api/v2/pagos/  ──▶  flask_pagos:5000  (microservicio nuevo)
#   /               ──▶  django_web:8000   (monolito legacy)
#
# Las rutas antiguas /api/v1/ siguen llegando a Django sin modificación.
# El cliente no percibe el cambio: Nginx es el punto de entrada único en :80.
# ═══════════════════════════════════════════════════════════════════════════════

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_method $request '
                    '$status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Optimizaciones ───────────────────────────────────────────────────────
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # ── Upstream: Monolito Django ─────────────────────────────────────────────
    upstream django_web {
        server django_web:8000;
    }

    # ── Upstream: Microservicio Flask Pagos ───────────────────────────────────
    upstream flask_pagos {
        server flask_pagos:5000;
    }

    # ── Servidor Principal ────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── Health check del propio Nginx ─────────────────────────────────────
        location /nginx-health {
            access_log off;
            return 200 '{"status":"ok","proxy":"nginx"}';
            add_header Content-Type application/json;
        }

        # ── [MICROSERVICIO NUEVO] Rutas estranguladas → Flask Pagos ──────────
        # Todas las peticiones a /api/v2/pagos/* van al microservicio Flask.
        # Esta es la "estrangulación": el tráfico de pagos se deriva al nuevo servicio.
        location /api/v2/pagos/ {
            proxy_pass         http://flask_pagos;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;

            # Headers de trazabilidad
            add_header X-Served-By "flask-pagos-microservicio" always;
        }

        # ── Health check del microservicio Flask ──────────────────────────────
        location /api/v2/pagos/health {
            proxy_pass http://flask_pagos/health;
            proxy_set_header Host $host;
        }

        # ── [MONOLITO LEGACY] Rutas /api/v1/ y resto → Django ─────────────────
        # Todas las demás rutas (incluyendo /api/v1/, /admin/, etc.)
        # continúan siendo manejadas por el monolito Django.
        location / {
            proxy_pass         http://django_web;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;

            # Headers de trazabilidad
            add_header X-Served-By "django-monolito" always;
        }
    }
}
